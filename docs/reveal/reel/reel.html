<div id="fit"><div id="stage"></div></div>
<div id="ui"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="15" step="0.001" value="0"><span id="tc">0.00</span></div>
<script>
'use strict';
// ============================================================================
//  Setpiece — 15 second reel. Everything is a pure function of t (seconds),
//  so render(t) can be called for any frame, in any order, by the renderer.
// ============================================================================
const DUR = 15;
const W = 1920, H = 1080, SW = 1600, SH = 900;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: p => p,
  inQuad: p => p * p,
  outQuad: p => 1 - (1 - p) * (1 - p),
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inCubic: p => p * p * p,
  inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  outQuart: p => 1 - Math.pow(1 - p, 4),
  inQuart: p => p * p * p * p,
  inOutQuart: p => p < .5 ? 8 * p ** 4 : 1 - Math.pow(-2 * p + 2, 4) / 2,
  outQuint: p => 1 - Math.pow(1 - p, 5),
  inOutQuint: p => p < .5 ? 16 * p ** 5 : 1 - Math.pow(-2 * p + 2, 5) / 2,
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  inExpo: p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10),
  inOutExpo: p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
  inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  outBack: p => { const s = 1.70158; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); },
};
// Damped spring step response (0 → 1 with overshoot), dt in seconds.
function spring(dt, freq = 2.4, damp = .6) {
  if (dt <= 0) return 0;
  const w = 2 * Math.PI * freq, wd = w * Math.sqrt(1 - damp * damp);
  return 1 - Math.exp(-damp * w * dt) * (Math.cos(wd * dt) + (damp * w / wd) * Math.sin(wd * dt));
}
// Keyframe track: [[time, value, ease-into-this-key], ...]
function track(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];

// Procedural "Blue hour" video.
function makeScene(parent) {
  const svg = sv('svg', parent, { viewBox: '0 0 1600 900', preserveAspectRatio: 'xMidYMid slice' });
  const defs = sv('defs', svg, {});
  const sky = sv('linearGradient', defs, { id: 'sky', x1: 0, y1: 0, x2: 0, y2: 1 });
  [['0', '#101838'], ['.5', '#34386a'], ['.78', '#7d6f98'], ['1', '#a08aa8']].forEach(([o, c]) => sv('stop', sky, { offset: o, 'stop-color': c }));
  const mg = sv('radialGradient', defs, { id: 'mglow' });
  sv('stop', mg, { offset: '0', 'stop-color': '#dfe6f5', 'stop-opacity': '.55' });
  sv('stop', mg, { offset: '1', 'stop-color': '#dfe6f5', 'stop-opacity': '0' });
  const root = sv('g', svg, {});
  sv('rect', root, { x: -100, y: -100, width: 1800, height: 1100, fill: 'url(#sky)' });
  const r = rng(7), stars = [];
  for (let i = 0; i < 70; i++) stars.push({ e: sv('circle', root, { cx: r() * 1600, cy: r() * 470, r: .8 + r() * 1.8, fill: '#fff' }), k: 1 + r() * 3, ph: r() * 6 });
  const glow = sv('circle', root, { cx: 1160, cy: 250, r: 300, fill: 'url(#mglow)' });
  const moon = sv('circle', root, { cx: 1160, cy: 250, r: 96, fill: '#d6deec' });
  const waves = [['#2d3f6c', 600, 38, .0042, .55], ['#1f2d55', 700, 30, .0056, -.8], ['#141d3a', 800, 24, .0071, 1.1]]
    .map(([c, base, a, f, sp]) => ({ e: sv('path', root, { fill: c }), base, a, f, sp }));
  const glints = [];
  for (let i = 0; i < 9; i++) glints.push(sv('rect', root, { x: 0, y: 0, width: 10, height: 3, rx: 1.5, fill: '#dfe6f5' }));
  const mono = sv('rect', root, { x: 210, y: 330, width: 180, height: 800, rx: 90, fill: '#1a2344', stroke: 'rgba(255,255,255,.07)', 'stroke-width': 2 });
  function update(tv) {
    const drift = tv * 7;
    stars.forEach(s => s.e.setAttribute('opacity', (.35 + .65 * Math.abs(Math.sin(tv * s.k + s.ph))).toFixed(3)));
    const my = 262 - tv * 7;
    moon.setAttribute('cy', my); glow.setAttribute('cy', my);
    glow.setAttribute('r', 290 + Math.sin(tv * 2) * 10);
    for (const w of waves) {
      let d = `M -60 1000 L -60 ${w.base}`;
      for (let x = -60; x <= 1660; x += 40) {
        const y = w.base + Math.sin(x * w.f + tv * w.sp) * w.a + Math.sin(x * w.f * 2.3 - tv * w.sp * 1.6) * w.a * .35;
        d += ` L ${x} ${y.toFixed(1)}`;
      }
      w.e.setAttribute('d', d + ' L 1660 1000 Z');
    }
    glints.forEach((g, i) => {
      const y = 620 + i * 14, ww = 90 - i * 7 + Math.sin(tv * 3 + i) * 20;
      g.setAttribute('x', (1160 - ww / 2 + Math.sin(tv * 1.7 + i * 2) * 12).toFixed(1));
      g.setAttribute('y', y); g.setAttribute('width', ww.toFixed(1));

    });
    mono.setAttribute('x', 210 - drift);
    root.setAttribute('transform', `translate(${(-drift * .4).toFixed(2)} 0) scale(${1 + tv * .004})`);
  }
  return { update };
}

// ============================================================================
//  Render
// ============================================================================
const IMPACTS = [[5.02, 2.2], [5.26, 2], [5.48, 2], [5.72, 2], [5.98, 2.6], [7.05, 8]];

function camera(t) {
  const c = {
    s: track(t, [[0, 1.2], [3.92, 1.2], [4.9, .74, E.inOutQuint], [7.0, .78, E.inOutSine], [8.5, .96, E.inOutCubic], [9.05, .965, E.lin], [9.72, .86, E.inOutCubic], [10.2, .875, E.lin], [11.2, .45, E.inOutQuint], [12.4, .47, E.inOutSine], [12.85, .47, E.inOutCubic]]),
    rx: track(t, [[0, 0], [3.92, 0], [4.9, 9, E.inOutQuint], [7.0, 7, E.inOutSine], [8.5, 4], [9.05, 4, E.lin], [9.72, 3.5], [10.2, 3.5, E.lin], [11.2, 11, E.inOutQuint], [12.4, 8, E.inOutSine], [12.85, 0, E.inOutCubic]]),
    ry: track(t, [[0, 0], [3.92, 0], [4.9, -17, E.inOutQuint], [7.0, -10, E.inOutSine], [8.5, -6], [9.05, -5.5, E.lin], [9.72, -5], [10.2, -4.5, E.lin], [11.2, -3, E.inOutQuint], [12.4, 4, E.inOutSine], [12.85, 0, E.inOutCubic]]),
    tx: track(t, [[0, 0], [3.92, 0], [4.9, 30, E.inOutQuint], [7.0, 20, E.inOutSine], [8.5, 250], [9.05, 255, E.lin], [9.72, 40], [10.2, 35, E.lin], [11.2, -150, E.inOutQuint], [12.4, -160, E.inOutSine], [12.85, -154, E.inOutCubic]]),
    ty: track(t, [[0, 0], [3.92, 0], [4.9, -20, E.inOutQuint], [7.0, -15, E.inOutSine], [8.5, 128], [9.05, 130, E.lin], [9.72, 0], [10.2, -5, E.lin], [11.2, -60, E.inOutQuint], [12.4, -50, E.inOutSine], [12.85, -50, E.inOutCubic]]),
    rz: 0,
  };
  // dive swoosh
  c.rz += -5 * Math.sin(Math.PI * E.inOutSine(prog(t, 2.06, 2.72)));
  // beat punches in act 2
  let pz = 0; for (const b of BEATS) pz += punch(t - b, 14);
  c.s *= 1 + .014 * pz;
  // impacts
  for (const [ti, a] of IMPACTS) { c.ty += decaySin(t - ti, a, 10, 58); c.rz += decaySin(t - ti, a * .05, 10, 47); }
  return c;
}

// world → stage projection when the camera has no rotation
const proj = (c, x, y) => [960 + c.tx + x * c.s, 540 + c.ty + y * c.s];

function slotRect(id, t) {
  let r = SLOT_STAGES[0].L[id].slice();
  for (let k = 1; k < SLOT_STAGES.length; k++) {
    const st = SLOT_STAGES[k];
    if (t < st.t) break;
    const p = st.fn ? st.fn(t - st.t) : spring(t - st.t, st.f || 2.6, st.d || .55);
    const a = SLOT_STAGES[k - 1].L[id], b = st.L[id];
    for (let i = 0; i < 4; i++) r[i] += (b[i] - a[i]) * p;
  }
  return r;
}

function paletteAt(t, x) {
  // which accent a tile at world-x shows at time t, with blend
  let idx = 0, blend = 1, since = 99;
  for (let k = 0; k < WAVES.length; k++) {
    const arrive = WAVES[k] + (x - WAVE_X0) / WAVE_SPEED;
    if (t >= arrive) { idx = k + 1; blend = clamp((t - arrive) / .14); since = t - arrive; }
  }
  return { idx, blend, since };
}
function catColor(cat, t, x) {
  const { idx, blend } = paletteAt(t, x);
  const from = PAL[Math.max(0, idx - 1)][cat], to = PAL[idx][cat];
  return idx === 0 ? PAL[0][cat] : mixc(from, to, blend);
}

let lastSec = -1;
function setRoll(elm, prev, cur, p) {
  const [a, b] = elm.children;
  a.textContent = prev; b.textContent = cur;
  elm.style.width = '';
  const y = -E.outBack(clamp(p)) ;
  a.style.transform = b.style.transform = `translateY(${(y * 100).toFixed(1)}%)`;
}

function render(t) {
  const c = camera(t);
  R.world.style.transform = `translate3d(${px(c.tx)},${px(c.ty)},0) rotateX(${c.rx.toFixed(3)}deg) rotateY(${c.ry.toFixed(3)}deg) rotateZ(${c.rz.toFixed(3)}deg) scale3d(${c.s},${c.s},${c.s})`;

  // ---------- ambient
  const [gx, gy] = proj(c, 0, 0);
  const actGlow = prog(t, .9, 1.6) * (1 - .5 * prog(t, 2.2, 2.8)) + .5 * prog(t, 3.9, 4.8) * (1 - prog(t, 12.9, 13.4)) + .8 * prog(t, 13.3, 14);
  R.glowA.style.transform = `translate(${px(gx - 1200)},${px(gy - 1200)}) scale(${(.6 + c.s * .5).toFixed(3)})`;
  R.glowA.style.opacity = clamp(actGlow).toFixed(3);
  R.glowB.style.transform = `translate(${px(gx - 900 + 500 + Math.sin(t * .6) * 120)},${px(gy - 900 + 250)})`;
  R.glowB.style.opacity = (.8 * prog(t, 4, 5) * (1 - prog(t, 12.6, 13.2))).toFixed(3);
  R.floor.style.transform = `translate3d(-3500px,640px,-3000px) rotateX(90deg)`;
  R.floor.style.opacity = (prog(t, 4.1, 5) * (1 - prog(t, 12.45, 12.85))).toFixed(3);

  renderIntro(t, c);
  renderMonitors(t, c);
  renderSlots(t);
  renderTiles(t);
  renderBrowser(t);
  renderCursor(t);
  renderOthers(t, c);
  renderEnd(t, c);
  renderGrain(t);
  R.fade.style.opacity = (1 - prog(t, 0, .25)).toFixed(3);
}

function renderIntro(t, c) {
  // streak of light
  const sp = prog(t, .05, .55), so = 1 - prog(t, .45, .95);
  R.streak.style.width = px(1500 * E.outExpo(sp));
  R.streak.style.transform = `translateX(-50%) scaleY(${(1 + 1.5 * (1 - sp)).toFixed(2)})`;
  R.streak.style.opacity = (sp > 0 ? so : 0).toFixed(3);
  // bloom behind the mark
  const bl = prog(t, .85, 1.25) * (1 - prog(t, 2.0, 2.5)) + prog(t, 13.35, 13.9) * .9;
  let pulse = 0; for (const b of [1.0, 1.12, 1.24, 13.45]) pulse += punch(t - b, 9) * .25;
  R.bloom.style.opacity = clamp(bl * .9 + pulse * .5).toFixed(3);
  R.bloom.style.transform = `scale(${(.7 + .3 * bl + pulse * .15).toFixed(3)})`;
}

function renderMonitors(t, c) {
  // Main monitor: bezel and stand appear with the pull-back. Side monitors slide in for act 4.
  const bez = prog(t, 3.95, 4.55) * (1 - prog(t, 12.55, 12.95));
  const flat = E.inOutCubic(prog(t, 12.4, 12.85));
  const morph = prog(t, 12.8, 13.45);
  // morph targets (stage → world)
  const cF = camera(12.9);
  const toWorld = (r) => { const w = r[2] / cF.s, h = r[3] / cF.s; return [(r[0] + r[2] / 2 - 960 - cF.tx) / cF.s, (r[1] + r[3] / 2 - 540 - cF.ty) / cF.s, w, h]; };
  const targets = { m1: toWorld(LG.left), m2: toWorld(LG.tr), m3: toWorld(LG.br) };

  const slideIn = E.outExpo(prog(t, 10.25, 11.05));
  const base = {
    m1: { x: 0, y: 0, z: 0, ry: 0 },
    m2: { x: 1463 + 700 * (1 - slideIn), y: 40, z: 276 - 300 * (1 - slideIn), ry: -25 },
    m3: { x: -1136 - 700 * (1 - slideIn), y: -40, z: 124 - 300 * (1 - slideIn), ry: 25 },
  };
  for (const k of ['m1', 'm2', 'm3']) {
    const m = R[k], b = base[k];
    let x = b.x, y = b.y, z = b.z * (1 - flat), ry = b.ry * (1 - flat);
    let w = m.w, h = m.h, rad = 12;
    if (t >= 12.8) {
      const T = targets[k];
      // position leads, size follows: the displays swirl in along arcs, then shrink into the mark
      const mp = E.inOutQuart(prog(t, 12.8, 13.4)), ms = E.inOutCubic(prog(t, 12.84, 13.4));
      const arc = Math.sin(Math.PI * mp) * ({ m1: -80, m2: -260, m3: 620 }[k]);
      x = lerp(b.x, T[0], mp); y = lerp(b.y, T[1], mp) + arc;
      w = lerp(m.w, T[2], ms); h = lerp(m.h, T[3], ms);
      rad = lerp(12, LG.cellR / cF.s, ms);
    }
    m.root.style.transform = `translate3d(${px(x)},${px(y)},${px(z)}) rotateY(${ry.toFixed(3)}deg)`;
    if (t >= 12.8 || m.cw !== m.w) sizeMonitor(m, Math.max(1, w), Math.max(1, h));
    m.wall.style.borderRadius = px(rad);
    const vis = k === 'm1' ? 1 : prog(t, 10.25, 10.6);
    m.root.style.opacity = (k === 'm1' ? 1 : vis * (t >= 13.4 ? 0 : 1)).toFixed(3);
    m.bezel.style.opacity = (k === 'm1' ? bez : (1 - prog(t, 12.55, 12.95))).toFixed(3);
    m.stand.style.opacity = (k === 'm1' ? bez : (1 - prog(t, 12.45, 12.8))).toFixed(3);
    m.stand.style.transform = `translateY(${px(16 + 60 * prog(t, 12.45, 12.8))})`;
    // morph tint → the logo cell's color
    const cell = { m1: '#3a32d2', m2: '#6b3a58', m3: '#454567' }[k];
    m.tint.style.background = cell;
    m.tint.style.opacity = E.inOutCubic(prog(t, 12.62, 13.0)).toFixed(3);
  }
  // main wallpaper shows from the pull-back on
  R.m1.wall.style.opacity = (prog(t, 3.95, 4.5) + (t > 12.6 ? 1 : 0)).toFixed(3);
  R.m1.wall.style.background = t < 4 ? 'transparent' : '#0e1418';
  if (t >= 13.4) { R.m1.root.style.opacity = 0; }
}

function renderSlots(t) {
  const ghostP = E.inOutCubic(prog(t, 3.92, 4.35));
  for (const id of IDS) {
    const S = R.slots[id];
    const r = slotRect(id, t);
    const w = Math.max(0, r[2]), h = Math.max(0, r[3]);
    const radius = lerp(LG.cellR / 1.2, 28, E.inOutCubic(prog(t, 2.06, 2.6)));
    S.s.style.transform = `translate3d(${px(r[0])},${px(r[1])},1px)`;
    S.s.style.width = px(w); S.s.style.height = px(h);
    S.s.style.borderRadius = px(Math.min(radius, w / 2, h / 2));
    // intro: cells fill in, one by one
    const fillIn = { browser: 1.0, clock: 1.12, weather: 1.24 }[id];
    let o = clamp(Math.min(w, h) / 12);
    let sc = 1;
    if (fillIn != null && t < 2) { const sp = spring(t - fillIn, 2.4, .5); o *= clamp(sp * 1.6); sc = .55 + .45 * sp; }
    // slot vanishes once its widget lands
    const f = FLIGHTS[id];
    const gone = t > f.land + .02 ? 0 : 1;
    S.s.style.opacity = (o * gone * (t > 12.6 ? 0 : 1)).toFixed(3);
    S.fill.style.transform = `scale(${sc.toFixed(4)})`;
    S.fill.style.opacity = (1 - ghostP).toFixed(3);
    S.ghost.style.opacity = ghostP.toFixed(3);
    S.ghost.style.transform = `scale(${(.94 + .06 * ghostP).toFixed(3)})`;
    if (S.word) {
      const [, wt] = WORDS[id];
      const pin = E.outExpo(prog(t, wt, wt + .45));
      const pout = E.inCubic(prog(t, 3.84, 4.05));
      S.word.style.transform = `translateY(${(110 * (1 - pin) - 120 * pout).toFixed(1)}%)`;
      S.word.style.opacity = (pin > 0 ? 1 - pout : 0).toFixed(3);
    }
  }
}

function renderTiles(t) {
  for (const id of IDS) {
    const T = R.tiles[id], f = FLIGHTS[id], r = LF[id];
    const start = f.land - f.dur;
    const p = prog(t, start, f.land);
    const vis = t >= start;
    T.tile.style.visibility = vis && t < 13.1 ? 'visible' : 'hidden';
    if (!vis) { R.ripples[id].style.opacity = 0; continue; }
    const pp = E.outQuart(p), pr = E.outCubic(p);
    let dx = f.off[0] * (1 - pp), dy = f.off[1] * (1 - pp), dz = f.off[2] * (1 - E.outQuint(p));
    let rx = f.rot[0] * (1 - pr), ry = f.rot[1] * (1 - pr), rz = f.rot[2] * (1 - pr);
    // arc: lift over the screen while travelling
    dz += Math.sin(Math.PI * p) * 120;
    const dl = t - f.land;
    let sc = 1;
    if (dl > 0) { sc = 1 - decaySin(dl, .045, 9, 26); dz += Math.abs(decaySin(dl, 10, 9, 22)); }
    // "still here" wave after the fullscreen moment
    const wi = { clock: 0, weather: 1, system: 2, group: 3, music: 4 }[id];
    if (wi != null) sc *= 1 + .03 * punch(t - (9.62 + wi * .07), 9);
    // accent wave pulse
    const wx = r[0] + r[2] / 2 - 800;
    if (CAT[id]) {
      const { since } = paletteAt(t, wx);
      sc *= 1 + .035 * punch(since, 16);
      T.body.style.background = catColor(CAT[id], t, wx);
      T.flash.style.opacity = (.35 * Math.exp(-Math.max(0, since) * 10) * (since < 9 ? 1 : 0) + (dl > 0 ? .4 * Math.exp(-dl * 9) : 0)).toFixed(3);
    } else {
      T.flash.style.opacity = (dl > 0 ? .28 * Math.exp(-dl * 8) : 0).toFixed(3);
    }
    // morph: fade out tiles
    const mo = 1 - prog(t, 12.55, 12.8);
    T.tile.style.opacity = mo.toFixed(3);
    T.tile.style.transform = `translate3d(${px(r[0] + dx)},${px(r[1] + dy)},${px(2 + dz)}) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) rotateZ(${rz.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
    // ripple on landing
    const rp = prog(t, f.land, f.land + .55);
    const rip = R.ripples[id];
    if (rp > 0 && rp < 1) {
      const g = 60 * E.outCubic(rp) * (id === 'browser' ? 1.6 : 1);
      rip.style.transform = `translate3d(${px(r[0] - g)},${px(r[1] - g)},3px)`;
      rip.style.width = px(r[2] + 2 * g); rip.style.height = px(r[3] + 2 * g);
      rip.style.opacity = ((1 - rp) * .9).toFixed(3);
      rip.style.borderRadius = px(28 + g);
      rip.style.borderColor = CAT[id] ? PAL[0].acc : '#e2dfff';
    } else rip.style.opacity = 0;
    // content boot-up after landing
    // content is already live mid-flight, and settles with a small stagger as it lands
    const boot = (els, d0) => els.forEach((e, i) => { const q = E.outCubic(prog(t, start + .06 + d0 + i * .04, start + .4 + d0 + i * .04)); e.style.opacity = q.toFixed(3); e.style.transform = `translateY(${px(24 * (1 - q) + decaySin(dl - i * .03, 5, 10, 24))})`; });
    if (id === 'clock') boot(R.clockEls, 0);
    if (id === 'weather') boot(R.weatherEls, 0);
    if (id === 'system') boot(R.systemEls, 0);
    if (id === 'group') boot(R.groupEls, 0);
    if (id === 'music') boot(R.musicEls, 0);
  }
  renderWidgetsLive(t);
}

function renderWidgetsLive(t) {
  // clock: 10:24:55 at t = 4.9, minute rolls over at t = 9.9
  const total = 24 * 60 + 55 + (t - 4.9);
  const sec = Math.floor(total) % 60, min = Math.floor(total / 60);
  const frac = total - Math.floor(total);
  const pad = n => String(n).padStart(2, '0');
  const rollP = clamp(frac / .28);
  setRoll(document.getElementById('secRoll'), pad((sec + 59) % 60), pad(sec), rollP);
  const minDigit = min % 10, prevDigit = (min + 9) % 10;
  const mp = sec === 0 ? rollP : 1;
  for (const id of ['minRoll', 'osloRoll', 'nyRoll']) setRoll(document.getElementById(id), prevDigit, minDigit, mp);
  // weather icon breathes
  R.weatherIcon.style.transform = `translateY(${px(Math.sin(t * 2.2) * 2)}) rotate(${(Math.sin(t * 1.3) * 4).toFixed(2)}deg)`;
  // system
  const playing = prog(t, 8.3, 9.3);
  const vals = { cpu: 18 + 6 * wob(t * 2, 1) + 9 * playing, mem: 47 + wob(t, 3), gpu: 34 + 5 * wob(t * 2, 5) + 28 * playing, tmp: 46 + 2 * wob(t, 7) + 5 * playing };
  for (const k in vals) {
    const v = vals[k];
    R.sys[k][0].textContent = k === 'tmp' ? `${Math.round(v)}°` : `${Math.round(v)}%`;
    R.sys[k][1].style.width = `${clamp(v / 100) * 100}%`;
  }
  // group: speaking ring
  const sp = (Math.sin(t * 9) * .5 + .5) * (Math.sin(t * 2.1) > -.3 ? 1 : .2);
  R.groupRing.style.opacity = sp.toFixed(3);
  R.groupRing.style.transform = `scale(${(1 + .12 * sp).toFixed(3)})`;
  // music
  const ms = 119 + (t - 5.9);
  R.mprog.style.width = `${(ms / 280 * 100).toFixed(2)}%`;
  R.mtime.textContent = `${Math.floor(ms / 60)}:${pad(Math.floor(ms % 60))}`;
  R.eq.forEach((e, i) => e.style.height = px(8 + 30 * Math.abs(Math.sin(t * (5 + i * 1.3) + i * 1.7) * Math.sin(t * (2.2 + i * .4)))));
  R.art.style.transform = `rotate(${(t * 12).toFixed(2)}deg)`;
}

// Browser: home grid → click → watch page → fullscreen inside the tile.
const CLICK1 = 7.95, CLICK2 = 9.05;
function cardRect(i) { const col = i % 3, row = Math.floor(i / 3); return [20 + col * 345, 16 + row * 244]; }
function renderBrowser(t) {
  const land = FLIGHTS.browser.land;
  // cards cascade in after landing, fly out on click
  const watch = E.inOutCubic(prog(t, CLICK1 + .05, CLICK1 + .55));
  R.cards.forEach((cd, i) => {
    const [x, y] = cardRect(i);
    const q = spring(t - (land - .5 + i * .045), 2.6, .62);
    const out = E.inCubic(prog(t, CLICK1 + .02 + (i === 0 ? 0 : i * .025), CLICK1 + .3 + i * .025));
    cd.style.transform = `translate(${px(x)},${px(y + 30 * (1 - q) + 40 * out)}) scale(${(.92 + .08 * q).toFixed(4)})`;
    cd.style.opacity = (clamp(q * 1.5) * (1 - out)).toFixed(3);
    if (i === 0) cd.querySelector('.th').style.visibility = 'hidden';  // the player stands in for it
  });
  // watch page elements
  const wp = (d) => E.outCubic(prog(t, CLICK1 + .25 + d, CLICK1 + .65 + d));
  const a = wp(0), b = wp(.06);
  R.watchTitle.style.opacity = a; R.watchTitle.style.transform = `translateY(${px(16 * (1 - a))})`;
  R.watchCh.style.opacity = b; R.watchCh.style.transform = `translateY(${px(16 * (1 - b))})`;
  R.upnext.forEach((u, i) => { const q = wp(.04 + i * .05); u.style.opacity = q; u.style.transform = `translateX(${px(40 * (1 - q))})`; });

  // player rect: card thumb → watch player → fullscreen (tile coords)
  const thumb = [20, 96, 329, 185], wat = [20, 96, 704, 396], full = [0, 0, 1060, 596];
  const fs = E.inOutQuart(prog(t, CLICK2 + .04, CLICK2 + .5));
  let pr = lerpRect(thumb, wat, watch);
  pr = lerpRect(pr, full, fs);
  const q0 = spring(t - (land - .5), 2.6, .62);
  const fsOvershoot = decaySin(t - (CLICK2 + .5), .012, 10, 30);
  R.player.style.transform = `translate(${px(pr[0])},${px(pr[1] + (1 - q0) * 30)}) scale(${(1 + fsOvershoot).toFixed(4)})`;
  R.player.style.width = px(pr[2]); R.player.style.height = px(pr[3]);
  R.player.style.opacity = clamp(q0 * 1.5).toFixed(3);
  R.player.style.borderRadius = px(lerp(lerp(14, 16, watch), 0, fs));
  // video time
  const tv = 3 + Math.max(0, t - CLICK1 - .3);
  R.scene.update(tv);
  // big play glyph pops on click, then fades
  const bp = prog(t, CLICK1, CLICK1 + .5);
  R.plBig.style.opacity = (bp > 0 ? (1 - bp) : 0).toFixed(3);
  R.plBig.style.transform = `scale(${(1 + .5 * E.outCubic(bp)).toFixed(3)})`;
  // controls
  const ctl = prog(t, CLICK1 + .45, CLICK1 + .7) * (1 - prog(t, CLICK2 + .55, CLICK2 + .85));
  R.plCtl.style.opacity = ctl.toFixed(3);
  const barP = .82 + (t - 8) * .01;
  R.plBar.style.width = `${(barP * 100).toFixed(2)}%`; R.plKnob.style.left = `${(barP * 100).toFixed(2)}%`;
  R.plFsIcon.textContent = t > CLICK2 + .1 ? 'fullscreen_exit' : 'fullscreen';
  R.plFsIcon.style.transform = `scale(${(1 + .35 * punch(t - CLICK2, 14)).toFixed(3)})`;
  // title overlay in fullscreen
  const tt = prog(t, CLICK2 + .5, CLICK2 + .8) * (1 - prog(t, CLICK2 + 1.6, CLICK2 + 1.9));
  R.plTitle.style.opacity = tt.toFixed(3);
  R.plTitle.style.transform = `translateY(${px(-10 * (1 - tt))})`;
  // chrome: tab title & url update on click, toolbar slides away in fullscreen
  const tp = E.inOutCubic(prog(t, CLICK1 + .1, CLICK1 + .4));
  R.tabTT.forEach(s => s.style.transform = `translateY(${(-100 * tp).toFixed(1)}%)`);
  R.tabTT[1].style.top = '100%';
  const typed = 'watch/blue-hour';
  const n = Math.floor(prog(t, CLICK1 + .05, CLICK1 + .35) * typed.length);
  R.url.innerHTML = t < CLICK1 + .05 ? 'media.local<span class="dim">/home</span>' : `media.local<span class="dim">/${typed.slice(0, n)}</span>`;
  R.brTop.style.transform = `translateY(${px(-30 * fs)})`;
  R.brTop.style.opacity = (1 - fs).toFixed(3);
  R.brContent.style.opacity = (1 - fs).toFixed(3);
}

function renderCursor(t) {
  // path: enters from below → Blue Hour thumbnail → fullscreen button → away
  const P = [
    [7.28, 760, 1010], [7.9, 200, 208], [8.5, 230, 240], [8.98, 714, 488], [9.5, 760, 520], [9.9, 900, 1000],
  ];
  let x = P[0][1], y = P[0][2];
  for (let i = 1; i < P.length; i++) {
    const [t0, x0, y0] = P[i - 1], [t1, x1, y1] = P[i];
    if (t >= t0) { const e = E.inOutCubic(prog(t, t0, t1)); x = lerp(x0, x1, e); y = lerp(y0, y1, e) - Math.sin(Math.PI * e) * 40; }
  }
  const vis = prog(t, 7.28, 7.4) * (1 - prog(t, 9.4, 9.6));
  let press = 0; for (const ct of [CLICK1, CLICK2]) press += Math.max(0, 1 - Math.abs(t - ct - .04) / .07);
  R.cursor.style.transform = `translate3d(${px(x)},${px(y)},40px) scale(${(1.15 - .18 * press).toFixed(3)})`;
  R.cursor.style.opacity = vis.toFixed(3);
  let ring = 0, rx = 200, ry = 208;
  for (const [ct, cx, cy] of [[CLICK1, 200, 208], [CLICK2, 714, 488]]) { const q = prog(t, ct, ct + .45); if (q > 0 && q < 1) { ring = q; rx = cx; ry = cy; } }
  R.clickRing.style.transform = `translate3d(${px(rx)},${px(ry)},35px) scale(${(.2 + 1.1 * E.outCubic(ring)).toFixed(3)})`;
  R.clickRing.style.opacity = ring > 0 ? (1 - ring).toFixed(3) : 0;
  // chips
  const chip = (e, t0, x, y) => {
    const s = spring(t - t0, 2.6, .5), o = clamp((t - t0) / .12) * (1 - prog(t, 10.35, 10.6));
    e.style.transform = `translate3d(${px(x)},${px(y)},30px) scale(${(.6 + .4 * s).toFixed(4)})`;
    e.style.opacity = o.toFixed(3);
  };
  chip(R.chip1, 9.42, 44, 528);
  chip(R.chip2, 9.66, 1110, 836);
}

function renderOthers(t, c) {
  const vis = prog(t, 10.25, 10.6);
  for (const m of R.mtiles) {
    const t0 = 10.62 + m.delay;
    const s = spring(t - t0, 2.5, .55);
    const worldX = (m.m === R.m2 ? 1463 - 640 : -1136 - 280) + m.r[0] + m.r[2] / 2;
    let sc = .7 + .3 * s;
    if (m.cat) {
      const { since } = paletteAt(t, worldX);
      sc *= 1 + .04 * punch(since, 16);
      m.e.style.background = catColor(m.cat, t, worldX);
      m.flash.style.opacity = (.4 * Math.exp(-Math.max(0, since) * 10) * (since < 9 ? 1 : 0)).toFixed(3);
    }
    m.e.style.transform = `scale(${sc.toFixed(4)})`;
    m.e.style.opacity = (clamp((t - t0) / .15) * vis * (1 - prog(t, 12.55, 12.8))).toFixed(3);
  }
  // wave band
  let wo = 0, wx = 0, col = '#c2c1ff';
  for (let k = 0; k < WAVES.length; k++) {
    const dt = t - WAVES[k];
    if (dt > 0 && dt < .8) { wx = WAVE_X0 + dt * WAVE_SPEED; wo = 1 - dt / .8; col = PAL[k + 1].acc; }
  }
  wo *= 1 - prog(t, 12.5, 12.75);
  R.wave.style.transform = `translate3d(${px(wx - 350)},-1300px,40px) skewX(-12deg)`;
  R.wave.style.background = `linear-gradient(90deg, transparent, ${col}22 40%, ${col}66 50%, ${col}22 60%, transparent)`;
  R.wave.style.opacity = (wo * .9).toFixed(3);
  // captions
  capAnim(R.cap1, t, 10.72, 11.42, PAL[0].acc);
  const { idx } = paletteAt(t, 0);
  capAnim(R.cap2, t, 11.6, 12.5, PAL[Math.min(idx, 3)].acc);
}
function capAnim(cap, t, tin, tout, acc) {
  cap.c.style.setProperty('--acc', acc);
  cap.words.forEach((w, i) => {
    const a = E.outExpo(prog(t, tin + i * .045, tin + .45 + i * .045));
    const b = E.inCubic(prog(t, tout + i * .02, tout + .17 + i * .02));
    w.style.transform = `translateY(${(110 * (1 - a) - 110 * b).toFixed(1)}%)`;
  });
  cap.c.style.opacity = t > tin - .05 && t < tout + .4 ? 1 : 0;
}

function renderEnd(t, c) {
  const g = LG;
  // outline draw-on: intro, then again at the end
  const d1 = E.inOutCubic(prog(t, .28, 1.0)), d2 = E.inOutCubic(prog(t, 13.4, 13.95));
  const lv1 = E.outCubic(prog(t, .7, 1.05)), lv2 = E.outCubic(prog(t, 13.6, 13.95));
  const lh1 = E.outCubic(prog(t, .82, 1.1)), lh2 = E.outCubic(prog(t, 13.7, 14.05));
  const introOut = 1 - prog(t, 2.06, 2.3);
  const isEnd = t > 13;
  const setDraw = (e, p) => e.setAttribute('stroke-dashoffset', (1 - p).toFixed(4));
  setDraw(R.lrect, isEnd ? d2 : d1); setDraw(R.lv, isEnd ? lv2 : lv1); setDraw(R.lh, isEnd ? lh2 : lh1);
  // during the dive the outline races outwards and fades
  const dv = E.inExpo(prog(t, 2.06, 2.45));
  R.lsvg.style.transformOrigin = `${LOGO.cx}px ${LOGO.cy}px`;
  // end: a slow push, plus a small snap when the displays lock into the mark
  const endScale = 1 + .025 * prog(t, 13.4, 15) + .035 * punch(t - 13.42, 11);
  R.lsvg.style.transform = isEnd ? `scale(${endScale.toFixed(4)})` : `scale(${(1 + dv * 5).toFixed(3)})`;
  R.lsvg.style.opacity = (isEnd ? 1 : introOut).toFixed(3);
  // end cells (stage-level) take over from the morphing displays
  const cells = [g.left, g.tr, g.br], cols = ['#3a32d2', '#6b3a58', '#454567'];
  const endOn = t >= 13.4;
  R.lcells.forEach((e, i) => {
    const r = cells[i];
    const sx = LOGO.cx + (r[0] - LOGO.cx) * endScale, sy = LOGO.cy + (r[1] - LOGO.cy) * endScale;
    e.style.cssText = `transform:translate(${px(sx)},${px(sy)});width:${px(r[2] * endScale)};height:${px(r[3] * endScale)};border-radius:${px(g.cellR * endScale)};background:${cols[i]};opacity:${endOn ? 1 : 0}`;
  });
  // wordmark: intro and outro
  const letterIn = (t0) => R.letters.map((_, i) => E.outExpo(prog(t, t0 + i * .035, t0 + .55 + i * .035)));
  const inA = letterIn(1.18), inB = letterIn(13.55);
  R.letters.forEach((l, i) => {
    let p, out = 0;
    if (!isEnd) { p = inA[i]; out = E.inCubic(prog(t, 1.95 + i * .015, 2.2 + i * .015)); }
    else p = inB[i];
    const y = 60 * (1 - p) - 90 * out;
    l.style.transform = `translateY(${px(y)}) scale(${(1 + .0 * out).toFixed(3)})`;
    l.style.opacity = (p * (1 - out)).toFixed(3);
    l.style.filter = `blur(${((1 - p) * 10 + out * 8).toFixed(2)}px)`;
    l.style.fontStretch = `${(100 + 18 * p).toFixed(1)}%`;
  });
  const wmScale = 1 + .025 * prog(t, 13.4, 15);
  R.wordmark.style.transform = isEnd ? `scale(${wmScale.toFixed(4)})` : 'none';
  R.wordmark.style.transformOrigin = `960px ${LOGO.cy - 590}px`;
  const tg = E.outCubic(prog(t, 13.95, 14.45));
  R.tagline.style.opacity = tg.toFixed(3);
  R.tagline.style.transform = `translateY(${px(20 * (1 - tg))})`;
  // light sweep across the wordmark: a gradient clipped to the letters
  const sw = E.inOutSine(prog(t, 14.2, 14.9));
  const c0 = 30 + sw * 40;
  R.shine.style.backgroundImage = `linear-gradient(105deg, transparent ${(c0 - 9).toFixed(2)}%, rgba(160,150,255,.95) ${(c0 - 3).toFixed(2)}%, #fff ${c0.toFixed(2)}%, rgba(160,150,255,.95) ${(c0 + 3).toFixed(2)}%, transparent ${(c0 + 9).toFixed(2)}%)`;
  R.shine.style.filter = `drop-shadow(0 0 18px rgba(160,150,255,.8))`;
  R.shine.style.opacity = sw > 0 && sw < 1 ? 1 : 0;
  R.shine.style.transform = R.wordmark.style.transform;
  R.shine.style.transformOrigin = R.wordmark.style.transformOrigin;
  R.sweep.style.opacity = 0;
}

function renderGrain(t) {
  const f = Math.floor(t * 30);
  if (f === R.gframe) return;
  R.gframe = f;
  const r = rng(f * 7919 + 13), d = R.gimg.data;
  for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  R.gctx.putImageData(R.gimg, 0, 0);
}

// ============================================================================
build();
window.render = render;
window.DUR = DUR;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => { }))]).then(() => document.fonts.load('24px "Material Symbols Rounded"')).then(() => { render(0); return true; });

// preview player
const params = new URLSearchParams(location.search);
if (params.has('render')) {
  document.body.classList.add('render');
} else {
  const fit = document.getElementById('fit');
  const resize = () => { const s = Math.min(innerWidth / W, (innerHeight - 40) / H); fit.style.transform = `scale(${s})`; };
  addEventListener('resize', resize); resize();
  let playing = true, t0 = performance.now(), cur = +(params.get('t') || 0);
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), btn = document.getElementById('play');
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Play'; t0 = performance.now() - cur * 1000; };
  scrub.oninput = () => { cur = +scrub.value; playing = false; btn.textContent = 'Play'; render(cur); tc.textContent = cur.toFixed(2); };
  window.ready.then(() => {
    t0 = performance.now() - cur * 1000;
    const loop = () => {
      if (playing) { cur = ((performance.now() - t0) / 1000) % DUR; render(cur); scrub.value = cur; tc.textContent = cur.toFixed(2); }
      requestAnimationFrame(loop);
    };
    loop();
  });
}
</script>
