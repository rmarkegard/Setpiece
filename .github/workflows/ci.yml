name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: UI/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
        working-directory: UI
      - run: node node_modules/@angular/cli/bin/ng.js build --configuration production
        working-directory: UI
      - run: node --test UI/tests/domain.test.ts UI/tests/widget-layout.test.ts UI/tests/theme.test.ts
      - run: dotnet build Setpiece/Setpiece.csproj -c Release
      - run: dotnet run --project Verification/Setpiece.Verification.csproj -c Release
